<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>钓鱼记录</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
  html,body,#map{height:100%;margin:0}
  #map{position:absolute;top:0;bottom:0;left:0;right:0}
  #panel{position:absolute;top:10px;left:10px;z-index:1000;display:flex;gap:6px;flex-wrap:wrap}
  #panel button,.btn{
    padding:8px 10px;background:#fff;border:1px solid #ccc;border-radius:6px;
    font-size:14px;display:inline-block
  }
  #importFile{display:none}
  #form{
    position:absolute;bottom:0;left:0;right:0;background:#fff;z-index:1000;
    padding:12px;box-shadow:0 -2px 10px rgba(0,0,0,.2);
    display:flex;flex-direction:column;gap:8px
  }
  #form.hidden{display:none}
  #form input,#form textarea{
    padding:8px;border:1px solid #ccc;border-radius:6px;font-size:16px
  }
  #list{
    position:absolute;top:60px;left:10px;z-index:1000;
    max-height:40%;overflow:auto;width:65%
  }
  .item{
    background:#fff;padding:8px;margin-bottom:5px;border-radius:6px;
    box-shadow:0 1px 4px rgba(0,0,0,.2);font-size:14px
  }
</style>
</head>
<body>

<div id="map"></div>

<div id="panel">
  <button id="locBtn">定位</button>
  <button id="exportBtn">导出</button>
  <label class="btn">导入<input type="file" id="importFile" accept=".json"></label>
</div>

<div id="form" class="hidden">
  <h3 style="margin:0">添加钓点</h3>
  <input id="name" placeholder="钓点名称">
  <input id="fish" placeholder="鱼种，例如鲫鱼、鲤鱼">
  <textarea id="note" placeholder="备注：饵料、天气、水深等"></textarea>
  <button id="saveBtn">保存</button>
  <button id="cancelBtn">取消</button>
</div>

<div id="list"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const map = L.map('map').setView([28.0, 115.0], 10);

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  maxZoom: 19,
  attribution: '© OpenStreetMap'
}).addTo(map);

let spots = JSON.parse(localStorage.getItem('fishing_spots') || '[]');
let markers = [];
let tempLatLng = null;

function save() {
  localStorage.setItem('fishing_spots', JSON.stringify(spots));
  render();
}

function render() {
  markers.forEach(m => map.removeLayer(m));
  markers = [];

  const list = document.getElementById('list');
  list.innerHTML = '';

  spots.forEach(s => {
    const marker = L.marker([s.lat, s.lng])
      .addTo(map)
      .bindPopup(`<b>${s.name}</b><br>${s.fish || ''}<br>${s.note || ''}`);

    markers.push(marker);

    const div = document.createElement('div');
    div.className = 'item';
    div.innerHTML = `<b>${s.name}</b><br>${s.fish || ''} ${s.note || ''}`;
    div.onclick = () => map.setView([s.lat, s.lng], 15);
    list.appendChild(div);
  });
}

map.on('click', e => {
  tempLatLng = e.latlng;
  document.getElementById('form').classList.remove('hidden');
});

document.getElementById('saveBtn').onclick = () => {
  if (!tempLatLng) return;

  const name = document.getElementById('name').value.trim() || '未命名钓点';
  const fish = document.getElementById('fish').value.trim();
  const note = document.getElementById('note').value.trim();

  spots.push({
    lat: tempLatLng.lat,
    lng: tempLatLng.lng,
    name,
    fish,
    note,
    time: new Date().toISOString()
  });

  save();

  document.getElementById('form').classList.add('hidden');
  document.getElementById('name').value = '';
  document.getElementById('fish').value = '';
  document.getElementById('note').value = '';
  tempLatLng = null;
};

document.getElementById('cancelBtn').onclick = () => {
  document.getElementById('form').classList.add('hidden');
  tempLatLng = null;
};

document.getElementById('locBtn').onclick = () => {
  navigator.geolocation.getCurrentPosition(
    p => {
      const latlng = [p.coords.latitude, p.coords.longitude];
      map.setView(latlng, 15);
      L.circleMarker(latlng, { radius: 8, color: 'blue' })
        .addTo(map)
        .bindPopup('你在这里')
        .openPopup();
    },
    err => alert('定位失败：' + err.message),
    { enableHighAccuracy: true }
  );
};

document.getElementById('exportBtn').onclick = () => {
  const blob = new Blob([JSON.stringify(spots, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'fishing_spots.json';
  a.click();
};

document.getElementById('importFile').onchange = e => {
  const file = e.target.files[0];
  if (!file) return;

  const reader = new FileReader();
  reader.onload = () => {
    try {
      spots = JSON.parse(reader.result);
      save();
      alert('导入成功');
    } catch (err) {
      alert('文件格式错误');
    }
  };
  reader.readAsText(file);
};

render();
</script>
</body>
</html>
