<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>钓鱼记录</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
  html,body,#map{height:100%;margin:0}
  #map{position:absolute;top:0;bottom:0;left:0;right:0}
  .top-btn{position:absolute;top:10px;z-index:1000;background:#fff;border:1px solid #ccc;border-radius:6px;padding:8px 12px;font-size:14px;box-shadow:0 1px 4px rgba(0,0,0,.2);white-space:nowrap}
  #locBtn{left:10px}
  #refreshBtn{left:75px}
  #searchBtn{right:75px;font-size:16px;padding:8px 10px}
  #menuBtn{right:10px}
  
  /* 菜单面板 */
  #menuPanel{position:absolute;top:50px;right:10px;z-index:1000;background:#fff;border:1px solid #ccc;border-radius:6px;padding:10px;box-shadow:0 2px 10px rgba(0,0,0,.2);display:none;min-width:80px}
  #menuPanel button{display:block;width:100%;padding:8px;margin-bottom:5px;border:none;background:#f5f5f5;border-radius:4px;font-size:14px}
  
  /* 标点列表面板 */
  #spotListPanel{position:absolute;top:50px;right:10px;z-index:1000;background:#fff;border:1px solid #ccc;border-radius:6px;padding:10px;box-shadow:0 2px 10px rgba(0,0,0,.2);display:none;max-height:60vh;overflow-y:auto;width:150px}
  #spotListPanel h4{margin:0 0 10px 0;font-size:14px;color:#333;border-bottom:1px solid #eee;padding-bottom:5px}
  .spot-item{padding:8px 5px;border-bottom:1px solid #eee;font-size:14px;cursor:pointer;word-break:break-all}
  .spot-item:last-child{border-bottom:none}
  .spot-item:active{background:#e0f0ff}
  
  /* 导入导出面板 */
  #importExportPanel{position:absolute;top:50px;right:10px;z-index:1000;background:#fff;border:1px solid #ccc;border-radius:6px;padding:15px;box-shadow:0 2px 10px rgba(0,0,0,.2);display:none;width:220px}
  #importExportPanel h4{margin:0 0 10px 0;font-size:14px;color:#333;border-bottom:1px solid #eee;padding-bottom:5px}
  #importExportPanel button{width:100%;padding:8px;margin-bottom:8px;border:none;background:#f5f5f5;border-radius:4px;font-size:14px;cursor:pointer}
  .import-label{display:block;width:100%;padding:8px;margin-bottom:8px;background:#f5f5f5;border-radius:4px;font-size:14px;text-align:center;box-sizing:border-box;cursor:pointer}
  .red-tutorial{color:red;font-size:12px;line-height:1.5;margin-top:10px;padding-top:10px;border-top:1px dashed #eee}
  
  /* 表单 */
  #form{position:absolute;bottom:0;left:0;right:0;background:#fff;z-index:1000;padding:12px;box-shadow:0 -2px 10px rgba(0,0,0,.2);display:flex;flex-direction:column;gap:8px}
  #form.hidden{display:none}
  #form input,#form textarea{padding:8px;border:1px solid #ccc;border-radius:6px;font-size:16px}
  
  /* 弹窗操作 */
  .popup-actions{text-align:right;margin-top:8px}
  .popup-edit{color:green;font-weight:bold;cursor:pointer;font-size:14px;margin-right:20px}
  .popup-delete{color:red;font-weight:bold;cursor:pointer;font-size:14px}
</style>
</head>
<body>
<div id="map"></div>
<button id="locBtn" class="top-btn">定位</button>
<button id="refreshBtn" class="top-btn">刷新</button>
<button id="searchBtn" class="top-btn">🔎</button>
<button id="menuBtn" class="top-btn">菜单</button>

<div id="menuPanel">
  <button id="viewSpotList">标点</button>
  <button id="viewImportExport">导入导出标点</button>
</div>

<div id="spotListPanel">
  <h4>钓点列表</h4>
  <div id="spotNamesContainer"></div>
</div>

<div id="importExportPanel">
  <h4>导入导出标点</h4>
  <button id="exportBtn">导出标点（下载文件）</button>
  <label class="import-label">
    导入标点（选择文件）
    <input type="file" id="importFileInput" accept=".json" style="display:none">
  </label>
  <div class="red-tutorial">
    <b>教程：</b><br>
    1. 点击“导出标点”，会下载一个 spots.json 文件，请保存好，这就是你的所有钓鱼日记。<br>
    2. 点击“导入标点”，选择之前导出的 spots.json 文件，即可恢复数据。<br>
    ⚠️ 注意：导入会覆盖当前所有标点，建议先导出备份。
  </div>
</div>

<div id="form" class="hidden">
  <h3 style="margin:0" id="formTitle">添加钓点</h3>
  <input id="name" placeholder="钓点名称">
  <input id="fish" placeholder="鱼种，例如鲫鱼、鲤鱼">
  <textarea id="note" placeholder="备注：饵料、天气、水深等"></textarea>
  <button id="saveBtn">保存</button>
  <button id="cancelBtn">取消</button>
</div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script>
const savedView = JSON.parse(localStorage.getItem('fishing_map_view') || 'null');
const initialCenter = savedView ? [savedView.lat, savedView.lng] : [28.0, 115.0];
const initialZoom = savedView ? savedView.zoom : 10;
const map = L.map('map').setView(initialCenter, initialZoom);
L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', { attribution: '© Esri' }).addTo(map);

let spots = JSON.parse(localStorage.getItem('fishing_spots') || '[]');
let markers = [];
let tempLatLng = null;
let editingIndex = -1;

function render() {
  markers.forEach(m => map.removeLayer(m));
  markers = [];
  spots.forEach((s, idx) => {
    const popupContent = `
      <b>${s.name}</b><br>
      鱼种：${s.fish || '无'}<br>
      备注：${s.note || '无'}
      <div class="popup-actions">
        <span class="popup-edit" onclick="editSpot(${idx})">修改</span>
        <span class="popup-delete" onclick="deleteSpot(${idx})">删除</span>
      </div>
    `;
    const marker = L.marker([s.lat, s.lng]).addTo(map).bindPopup(popupContent);
    markers.push(marker);
  });

  const container = document.getElementById('spotNamesContainer');
  container.innerHTML = '';
  spots.forEach((s, idx) => {
    const div = document.createElement('div');
    div.className = 'spot-item';
    div.textContent = s.name;
    div.onclick = () => {
      map.setView([s.lat, s.lng], 15);
      document.getElementById('spotListPanel').style.display = 'none';
      document.getElementById('menuPanel').style.display = 'none';
    };
    container.appendChild(div);
  });
}

window.editSpot = function(idx) {
  editingIndex = idx;
  const s = spots[idx];
  document.getElementById('name').value = s.name;
  document.getElementById('fish').value = s.fish || '';
  document.getElementById('note').value = s.note || '';
  document.getElementById('formTitle').textContent = '修改钓点';
  document.getElementById('form').classList.remove('hidden');
  map.closePopup();
};

window.deleteSpot = function(idx) {
  if (!confirm('确定要删除这个钓点吗？此操作不可恢复。')) return;
  spots.splice(idx, 1);
  localStorage.setItem('fishing_spots', JSON.stringify(spots));
  render();
  map.closePopup();
};

map.on('moveend', () => {
  const center = map.getCenter();
  localStorage.setItem('fishing_map_view', JSON.stringify({ lat: center.lat, lng: center.lng, zoom: map.getZoom() }));
});

map.on('click', e => {
  if (!document.getElementById('form').classList.contains('hidden')) return;
  tempLatLng = e.latlng;
  editingIndex = -1;
  document.getElementById('name').value = '';
  document.getElementById('fish').value = '';
  document.getElementById('note').value = '';
  document.getElementById('formTitle').textContent = '添加钓点';
  document.getElementById('form').classList.remove('hidden');
});

document.getElementById('saveBtn').onclick = () => {
  const name = document.getElementById('name').value.trim() || '未命名钓点';
  const fish = document.getElementById('fish').value.trim();
  const note = document.getElementById('note').value.trim();

  if (editingIndex >= 0) {
    spots[editingIndex].name = name;
    spots[editingIndex].fish = fish;
    spots[editingIndex].note = note;
  } else {
    if (!tempLatLng) return;
    spots.push({ lat: tempLatLng.lat, lng: tempLatLng.lng, name, fish, note, time: new Date().toISOString() });
  }

  localStorage.setItem('fishing_spots', JSON.stringify(spots));
  render();
  document.getElementById('form').classList.add('hidden');
  tempLatLng = null;
  editingIndex = -1;
};

document.getElementById('cancelBtn').onclick = () => {
  document.getElementById('form').classList.add('hidden');
  tempLatLng = null;
  editingIndex = -1;
};

document.getElementById('locBtn').onclick = () => {
  navigator.geolocation.getCurrentPosition(
    p => {
      const latlng = [p.coords.latitude, p.coords.longitude];
      map.setView(latlng, 15);
      L.circleMarker(latlng, { radius: 8, color: 'blue' }).addTo(map).bindPopup('你在这里').openPopup();
    },
    err => alert('定位失败：' + err.message),
    { enableHighAccuracy: true }
  );
};

// 刷新按钮功能（重新从本地读取数据）
document.getElementById('refreshBtn').onclick = () => {
  spots = JSON.parse(localStorage.getItem('fishing_spots') || '[]');
  render();
  alert('本地数据已刷新');
};

// 新增：搜索按钮功能
document.getElementById('searchBtn').onclick = () => {
  const keyword = prompt('请输入要查找的钓点名称：');
  if (!keyword) return;

  // 关闭面板
  document.getElementById('spotListPanel').style.display = 'none';
  document.getElementById('importExportPanel').style.display = 'none';
  document.getElementById('menuPanel').style.display = 'none';

  // 模糊搜索：找到名称包含关键词的钓点
  const matched = spots.filter(s => s.name.includes(keyword));
  
  if (matched.length > 0) {
    // 定位到第一个匹配项
    const target = matched[0];
    map.setView([target.lat, target.lng], 16);
    if (matched.length > 1) {
      alert(`找到 ${matched.length} 个包含“${keyword}”的钓点，已定位到第一个。`);
    }
  } else {
    alert(`没有找到名称包含“${keyword}”的钓点。`);
  }
};

// 菜单交互
document.getElementById('menuBtn').onclick = () => {
  const menu = document.getElementById('menuPanel');
  const list = document.getElementById('spotListPanel');
  const impexp = document.getElementById('importExportPanel');
  list.style.display = 'none';
  impexp.style.display = 'none';
  menu.style.display = menu.style.display === 'block' ? 'none' : 'block';
};

document.getElementById('viewSpotList').onclick = () => {
  document.getElementById('menuPanel').style.display = 'none';
  document.getElementById('spotListPanel').style.display = 'block';
};

document.getElementById('viewImportExport').onclick = () => {
  document.getElementById('menuPanel').style.display = 'none';
  document.getElementById('importExportPanel').style.display = 'block';
};

// 导出功能
document.getElementById('exportBtn').onclick = () => {
  const blob = new Blob([JSON.stringify(spots, null, 2)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'spots.json';
  a.click();
};

// 导入功能
document.getElementById('importFileInput').onchange = e => {
  const file = e.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const data = JSON.parse(reader.result);
      if (Array.isArray(data)) {
        spots = data;
        localStorage.setItem('fishing_spots', JSON.stringify(spots));
        render();
        alert('导入成功！');
        document.getElementById('importExportPanel').style.display = 'none';
      } else {
        alert('文件格式错误，请导入正确的 JSON 文件。');
      }
    } catch (err) {
      alert('文件解析失败，请检查文件是否损坏。');
    }
  };
  reader.readAsText(file);
};

render();
</script>
</body>
</html>
